version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/app  # Change this if your deployment path is different
    overwrite: yes

hooks:
  BeforeInstall:
    - location: deploy/scripts/before_install.sh
      timeout: 300
      runas: ubuntu

  AfterInstall:
    - location: deploy/scripts/after_install.sh
      timeout: 300
      runas: ubuntu

  ApplicationStart:
    - location: deploy/scripts/start_server.sh
      timeout: 300
      runas: ubuntu

  ValidateService:
    - location: deploy/scripts/validate.sh
      timeout: 300
      runas: ubuntu
